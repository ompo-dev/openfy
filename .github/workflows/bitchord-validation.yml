name: Openfy BitChord Validation

on:
  push:
    branches: [codex/bitchord-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitchord-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      YOUTUBE_DL_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test -- --runInBand --silent
      - name: Check decoded PCM response
        run: |
          xcrun clang -std=c11 -Wall -Wextra -Werror \
            -I node_modules/expo-audio/ios scripts/check-audio-equalizer.c \
            -o "$RUNNER_TEMP/check-audio-equalizer"
          "$RUNNER_TEMP/check-audio-equalizer"
      - name: Compile AVPlayer audio processing
        run: |
          xcrun clang -c -fobjc-arc -fmodules \
            -target arm64-apple-ios16.4 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            node_modules/expo-audio/ios/AudioTapProcessor.m \
            -o "$RUNNER_TEMP/AudioTapProcessor.o"
      - name: Typecheck native streaming player
        run: |
          xcrun swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios16.4 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -import-objc-header node_modules/expo-audio/ios/AudioTapProcessor.h \
            modules/openfy-youtube/ios/YouTubeRequestRetry.swift \
            modules/openfy-youtube/ios/YouTubePlaybackDurationPolicy.swift \
            modules/openfy-youtube/ios/YouTubeStreamDescriptor.swift \
            modules/openfy-youtube/ios/YouTubeHTTPRangeClient.swift \
            modules/openfy-youtube/ios/OpenfyAssetResourceLoader.swift \
            modules/openfy-youtube/ios/OpenfyNativeYouTubePlayer.swift
